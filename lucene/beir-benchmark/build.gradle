plugins {
  id "java"
}

description = 'BEIR benchmark for Bayesian BM25 and hybrid search evaluation'

dependencies {
  moduleImplementation project(':lucene:core')
  moduleImplementation project(':lucene:analysis:common')
  moduleImplementation project(':lucene:queryparser')
}

def dataDirOption = buildOptions.addOption("dataDir", "Path to BEIR prepared data directory.", "/data/beir-prepared")
def datasetsOption = buildOptions.addOption("datasets", "Comma-separated dataset names (default: auto-discover).", "")
def topKOption = buildOptions.addOption("topK", "Number of results to retrieve per query.", "100")
def outputOption = buildOptions.addOption("outputFile", "Path to output TSV file.", "")
def heapSizeOption = buildOptions.addOption("maxHeapSize", "Heap size for the benchmark.", "4G")

tasks.register("run", JavaExec, {
  description = "Run the BEIR benchmark."
  group = "Utility launchers"

  mainClass = 'org.apache.lucene.benchmark.beir.BEIRBenchmark'
  classpath sourceSets.main.runtimeClasspath

  def argsList = ['--data-dir', dataDirOption.get()]

  if (datasetsOption.get() != "") {
    argsList.addAll(['--datasets', datasetsOption.get()])
  }
  argsList.addAll(['--top-k', topKOption.get()])
  if (outputOption.get() != "") {
    argsList.addAll(['--output', outputOption.get()])
  }

  args = argsList
  maxHeapSize = heapSizeOption.get()

  debugOptions {
    enabled = false
    port = 5005
    suspend = true
  }
})
